<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EN FA PDM - Cliente</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box} body{font-family:Arial,sans-serif;background:#FFF7ED;margin:0;padding:15px}
header{background:#EA580C;color:white;padding:18px;text-align:center;border-radius:16px}
.card{background:white;border-radius:16px;padding:16px;margin-top:15px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin-top:8px;font-size:15px}
button{border:none;padding:14px;border-radius:25px;font-weight:bold;font-size:15px;cursor:pointer;width:100%;margin-top:8px}
.btn-naranja{background:#EA580C;color:white} .btn-verde{background:#16A34A;color:white} .btn-gris{background:#eee}
.prod{display:flex;justify-content:space-between;align-items:center;background:#FFFBEB;border:1px solid #FDBA74;border-radius:12px;padding:10px;margin-top:8px}
.prod button{width:32px;height:32px;padding:0;border-radius:50%;background:#EA580C;color:white;font-size:18px;margin:0}
#mapa{height:220px;border-radius:14px;margin-top:10px;display:none}
.progreso{display:flex;justify-content:space-between;margin:15px 0 5px;font-size:11px;text-align:center}
.paso{flex:1;opacity:.35} .paso.activo{opacity:1;font-weight:bold;color:#EA580C}
.barra{height:8px;background:#eee;border-radius:10px;overflow:hidden} #barraProgreso{height:100%;width:10%;background:#EA580C;transition:.5s}
#verPedidoBtn{display:none;background:#111;color:white}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:15px;z-index:999}
#modal .card{width:100%;max-width:420px;max-height:90vh;overflow:auto}
</style>
</head>
<body>
<header><h1 style="margin:0">🛵 EN FA PDM</h1><p style="margin:5px 0 0;font-size:13px">Pide en Paso del Macho y síguelo en vivo.</p></header>

<button id="verPedidoBtn" onclick="abrirSeguimiento()">🧾 VER MI PEDIDO EN VIVO</button>

<div class="card">
<b>1. ¿Qué negocio?</b>
<select id="negocio">
<option>Carnitas Vale</option><option>Las Galeras</option><option>Chucumites</option><option>Antojitos Paraíso</option><option>El Compayito</option><option>Depósito Altamirano Iram</option><option>Depósito El Fuerte</option><option>7/24 y Oxxo</option><option>Super Sampieri</option><option>Super Vásquez</option><option>Lores</option><option>Aurrerá</option><option>Refaccionaria del Centro</option><option>Refaccionaria Osorio</option>
</select>
<b style="display:block;margin-top:12px">2. ¿Qué quieres?</b>
<div id="productos"></div>
<b style="display:block;margin-top:12px">3. Tus datos</b>
<input id="nombre" placeholder="Tu nombre">
<input id="direccion" placeholder="Tu dirección / referencia (ej: frente al parque)">
<input id="telefono" placeholder="Tu teléfono / WhatsApp">
<div style="background:#FFFBEB;padding:12px;border-radius:12px;margin-top:10px">
Subtotal: $<span id="sub">0</span><br>Comisión EN FA: $20<br><b>Total a pagar: $<span id="tot">20</span></b>
</div>
<button class="btn-naranja" onclick="pedir()">Pedir ahora 🛵</button>
</div>

<div id="modal"><div class="card">
<h3 style="margin:0" id="tituloModal">Tu pedido</h3>
<p id="textoEstado" style="color:#666"></p>
<div class="progreso">
<div class="paso" id="p1">🧾<br>Pedido</div>
<div class="paso" id="p2">🍳<br>Preparando</div>
<div class="paso" id="p3">🛵<br>En camino</div>
<div class="paso" id="p4">✅<br>Entregado</div>
</div>
<div class="barra"><div id="barraProgreso"></div></div>
<p id="tiempoLlegada" style="font-weight:bold;text-align:center"></p>
<div id="mapa"></div>
<p id="detallePedido" style="font-size:13px;color:#333"></p>
<button class="btn-gris" onclick="cerrarModal()">Cerrar (no se borra, puedes volver a verlo)</button>
</div></div>

<script>
const firebaseConfig={databaseURL:"https://en-fa-pdm-default-rtdb.firebaseio.com"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
let carrito={}; let miPedidoId=localStorage.getItem('ultimoPedido')||"";
let mapa=null, marcadorRepa=null, marcadorCasa=null;
const ubicNegocios={"Carnitas Vale":[18.971,-96.710],"Las Galeras":[18.972,-96.711],"Chucumites":[18.970,-96.709],"Antojitos Paraíso":[18.973,-96.712],"El Compayito":[18.9715,-96.7105],"Depósito Altamirano Iram":[18.969,-96.708],"Depósito El Fuerte":[18.974,-96.713],"7/24 y Oxxo":[18.972,-96.709],"Super Sampieri":[18.971,-96.711],"Super Vásquez":[18.970,-96.710],"Lores":[18.972,-96.712],"Aurrerá":[18.968,-96.709],"Refaccionaria del Centro":[18.971,-96.710],"Refaccionaria Osorio":[18.973,-96.711]};

function renderProductos(){
  let h="";
  for(let i=1;i<=5;i++){ h+=`<div class="prod"><span>Producto ${i} - $50</span><span><button onclick="cambiar(${i},-1)">-</button> <b id="c${i}">0</b> <button onclick="cambiar(${i},1)">+</button></span></div>`; }
  document.getElementById('productos').innerHTML=h;
}
function cambiar(i,d){ carrito[i]=Math.max(0,(carrito[i]||0)+d); document.getElementById('c'+i).innerText=carrito[i]; let sub=0; for(let k in carrito) sub+=carrito[k]*50; document.getElementById('sub').innerText=sub; document.getElementById('tot').innerText=sub+20; }
renderProductos();
if(miPedidoId) document.getElementById('verPedidoBtn').style.display='block';

function pedir(){
  let neg=document.getElementById('negocio').value;
  let nom=document.getElementById('nombre').value; let dir=document.getElementById('direccion').value;
  if(!nom||!dir){alert("Pon tu nombre y dirección");return;}
  let prods=[]; let sub=0; for(let k in carrito){ if(carrito[k]>0){prods.push(`Producto ${k} x${carrito[k]}`); sub+=carrito[k]*50;} }
  if(prods.length==0){alert("Elige al menos 1 producto");return;}
  let nuevo=db.ref('pedidos').push();
  miPedidoId=nuevo.key; localStorage.setItem('ultimoPedido',miPedidoId);
  nuevo.set({negocio:neg,cliente:nom,direccion:dir,productos:prods.join(", "),subtotal:sub,comision:20,total:sub+20,estado:"nuevo",fecha:Date.now()});
  document.getElementById('verPedidoBtn').style.display='block';
  abrirSeguimiento();
}
function abrirSeguimiento(){ document.getElementById('modal').style.display='flex'; escuchar(); }
function cerrarModal(){ document.getElementById('modal').style.display='none'; }
function escuchar(){
  if(!miPedidoId) return;
  db.ref('pedidos/'+miPedidoId).on('value', snap=>{
    let p=snap.val(); if(!p) return;
    let pasos={nuevo:1,preparando:2,listo:2,voy:3,camino:3,entregado:4,rechazado:1};
    let num=pasos[p.estado]||1;
    ["p1","p2","p3","p4"].forEach((id,idx)=>{ document.getElementById(id).classList.toggle('activo', idx < num); });
    document.getElementById('barraProgreso').style.width=(num*25)+"%";
    let textos={nuevo:"Esperando que el negocio tome tu pedido...",preparando:"🍳 El negocio está preparando tu pedido",listo:"🍽️ ¡Listo! Esperando repartidor",voy:"🛵 ¡Repartidor en camino! Mira el mapa",camino:"🛵 ¡Repartidor en camino! Mira el mapa",entregado:"✅ ¡Entregado! Gracias por pedir en EN FA",rechazado:"❌ Rechazado: "+(p.motivo||"")};
    document.getElementById('textoEstado').innerText=textos[p.estado]||p.estado;
    document.getElementById('tituloModal').innerText="Pedido en "+p.negocio;
    document.getElementById('detallePedido').innerHTML=`<b>${p.productos}</b><br>📍 ${p.direccion}<br>💰 Total: $${p.total}`;
    document.getElementById('tiempoLlegada').innerText = (p.estado==="voy"||p.estado==="camino") ? "⏱️ Llega en aprox 10 min" : (p.estado==="preparando" ? "⏱️ Preparando, unos 15 min" : "");
    let mostrarMapa = (p.estado==="voy"||p.estado==="camino"||p.estado==="listo");
    document.getElementById('mapa').style.display = mostrarMapa ? 'block' : 'none';
    if(mostrarMapa) dibujarMapa(p);
  });
}
function dibujarMapa(p){
  let centroNeg = ubicNegocios[p.negocio] || [18.971,-96.710];
  // Si el repartidor ya manda GPS real, usamos eso. Si no, simulamos el punto moviéndose hacia tu casa.
  let latRepa = p.repaLat || (centroNeg[0] + 0.002);
  let lngRepa = p.repaLng || (centroNeg[1] + 0.002);
  if(!mapa){
    mapa = L.map('mapa').setView(centroNeg, 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(mapa);
    L.marker(centroNeg).addTo(mapa).bindPopup("🏪 "+p.negocio);
    marcadorCasa = L.marker([centroNeg[0]-0.003, centroNeg[1]-0.003]).addTo(mapa).bindPopup("🏠 Tu casa");
  }
  if(!marcadorRepa) marcadorRepa = L.marker([latRepa,lngRepa]).addTo(mapa).bindPopup("🛵 Repartidor");
  else marcadorRepa.setLatLng([latRepa,lngRepa]);
  setTimeout(()=>{ if(mapa) mapa.invalidateSize(); },300);
}
</script>
</body>
</html>
